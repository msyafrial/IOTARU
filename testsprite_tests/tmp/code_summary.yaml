version: "2"
type: frontend
tech_stack:
  - Astro
  - TypeScript
  - Bootstrap
  - Swiper
  - GSAP
routes:
  - path: /
    file: src/pages/index.astro
    auth_required: false
    description: Home page
  - path: /solutions
    file: src/pages/solutions/index.astro
    auth_required: false
    description: Solutions overview
  - path: /solutions/:slug
    file: src/pages/solutions/[slug].astro
    auth_required: false
    description: Solution detail page
  - path: /products
    file: src/pages/products/index.astro
    auth_required: false
    description: Products catalog
  - path: /products/:slug
    file: src/pages/products/[slug].astro
    auth_required: false
    description: Product detail page
  - path: /blog
    file: src/pages/blog/index.astro
    auth_required: false
    description: Blog listing
  - path: /blog/:slug
    file: src/pages/blog/[slug].astro
    auth_required: false
    description: Blog detail page
  - path: /contact
    file: src/pages/contact/index.astro
    auth_required: false
    description: Contact form
features:
  - name: Navigation
    description: Global navigation via navbar and mobile menu
    files:
      - src/components/Navbar.astro
      - src/layouts/MainLayout.astro
    entry_route: /
    user_interactions:
      - Click navigation links
      - Open mobile hamburger menu
      - Close mobile menu
    api_calls: []
    auth_required: false
  - name: Global Loading Preloader
    description: Preloader blocking display until hero is loaded
    files:
      - src/components/Preloader.astro
    entry_route: /
    user_interactions:
      - Wait for preloader to dismiss
    api_calls: []
    auth_required: false
  - name: Solutions Hero and Grid
    description: Solutions page showing grid of offerings
    files:
      - src/pages/solutions/index.astro
    entry_route: /solutions
    user_interactions:
      - Scroll through grid cards
      - Click solution card to view details
    api_calls: []
    auth_required: false
known_limitations: []
