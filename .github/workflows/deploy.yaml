name: Deploy IOTARU

on:
  push:
    branches:
      - main
    # Push tag v1.2.3 -> build image versi 1.2.3 (rilis permanen)
    tags:
      - 'v*'

# Satu run per ref: push baru ke main membatalkan run main lama,
# tanpa mengganggu build rilis (tag) yang sedang jalan.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # WAJIB: izin push package ke GHCR pakai GITHUB_TOKEN bawaan
    # (tidak perlu membuat secret tambahan)
    permissions:
      contents: write    # membuat GitHub Release saat push tag
      packages: write    # push image ke GHCR
    steps:
      # Ambil source code dari repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Install dependency
      - name: Install dependencies
        run: npm ci

      # Build Astro — hasilnya dist/client (aset statis) + dist/server (SSR entry)
      - name: Build Astro
        run: npm run build

      # GHCR mewajibkan nama image lowercase
      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Penamaan versi otomatis:
      # - push main        -> :latest, :sha-<commit>
      # - push tag v1.2.3  -> :1.2.3, :1.2, :latest
      - name: Determine image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push image dengan semua tag dari metadata-action
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Riwayat versi: GitHub Release otomatis (changelog dari commit)
      # hanya dibuat saat push tag v*
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
